spring.application.name=ms-contenido

# Solo acepta conexiones de este computador (el emulador entra por 10.0.2.2)
server.address=127.0.0.1
server.port=8081

# Las credenciales de Supabase se leen de backend/.env (no se sube a GitHub)
spring.config.import=optional:file:../.env[.properties]

# Base de datos PostgreSQL en Supabase (la misma de ms-solicitudes, con sus propias tablas)
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# Las tablas y los datos de ejemplo los crea schema.sql
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# El JSON debe traer los números como enteros
spring.jackson.deserialization.accept-float-as-int=false
