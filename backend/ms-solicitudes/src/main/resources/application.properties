spring.application.name=ms-solicitudes

# Solo acepta conexiones de este computador (el emulador entra por 10.0.2.2)
server.address=127.0.0.1
server.port=8082

# Las credenciales de Supabase se leen de backend/.env (no se sube a GitHub).
# Ver .env.example
spring.config.import=optional:file:../.env[.properties]

# Base de datos PostgreSQL en Supabase
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
# El plan gratis de Supabase admite pocas conexiones simultáneas
spring.datasource.hikari.maximum-pool-size=5

# La tabla la crea schema.sql; Hibernate solo comprueba que calce con la entidad
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# El JSON debe traer el monto como entero y el tipo por su nombre
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
